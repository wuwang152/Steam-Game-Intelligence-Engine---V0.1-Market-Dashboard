name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check environment dependencies
        run: python scripts/check_environment.py

      - name: Run sample pipeline
        run: PYTHONPATH=src python scripts/run_pipeline.py --input data/sample/games_sample.csv --output data/processed/steam_games_cleaned.csv

      - name: Validate processed sample data
        run: PYTHONPATH=src python scripts/validate_data.py --input data/processed/steam_games_cleaned.csv

      - name: Run tests
        run: PYTHONPATH=src pytest -q
